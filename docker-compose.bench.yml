# ARTEX Tencent TSec Benchmark 평가 이미지: 로컬 원클릭 build + run.
# 운영용 docker-compose.yml(artex+postgres 다중 서비스)과 독립적입니다.
# 사용법:
#   cp bench/.env.example bench/.env   # LLM_API_KEY / BENCHMARK_TOKEN 등 입력
#   docker compose -f docker-compose.bench.yml up --build      # 빌드 후 포그라운드 실행(로그 확인)
#   docker compose -f docker-compose.bench.yml up --build -d   # 백그라운드 실행
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # 중지(-v를 추가하면 데이터 볼륨도 삭제)
# 브라우저: http://localhost:8787(ADMIN_PASSWORD로 로그인)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # 호스트 네트워크 스택을 공유하여 호스트/VPN의 대상 네트워크에 직접 연결합니다.
    # host 모드에서는 ports 매핑 없이 호스트 포트에 직접 바인딩합니다: 8787(UI/API), 8788(프록시),
    # 내부 PostgreSQL 5432. 로컬 테스트 전에 이 세 포트를 사용하는 서비스를 중지하세요.
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
